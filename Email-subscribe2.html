<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="dist/output.css" rel="stylesheet">
    <title>Email Subscribe</title>
</head>
<body>
    <div class="flex items-center justify-center min-h-screen bg-lime-300">
        <div class="bg-lime-600 p-2 mx-6 rounded-2xl">
            <div class="flex flex-col md:flex-row">
                <img src="images/image.jpg" alt=""
                class="object-cover rounded-xl w-80 md:h-64 md:rounded-l-xl md:rounded-r-none
                transform hover:scale-105 hover:rounded-xl duration-200"/>
                <div class="p-6 md:p-12">
                    <h2 class="font-serif text-xl font-medium text-center text-black md:text-left">
                        Get diet and fitness tips in your inbox
                    </h2>
                     <p class="max-w-xs my-4 text-xs leading-5 tracking-wide text-center text-black
                     md:text-left">
                     Eat better and exercise better. Sign up for the Diet&Fitness newsletter.
                    </p>
            <div class="flex flex-col mt-5 space-y-4 md:space-x-3 md:flex-row md:space-y-0">
              <input type="text" placeholder="Enter your email address"
                class="p-2 px-4 text-center text-black bg-white border border-black 
                placeholder:text-xs placeholder:text-center md:text-left placeholder:md:text-left 
                focus:outline-none"
              />
            <button class="px-5 py-3 text-xs rounded-md text-black bg-green-600 
            hover:bg-green-950 hover:text-white duration-500">
            Subscribe
          </button>

            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
