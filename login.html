<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="dist/output.css" rel="stylesheet">
  <!--<script src="https://cdn.tailwindcss.com"></script> -->
    <title>log in</title>
  </head>
  <body class="min-h-screen bg-rose-50 flex items-center justify-center p-6">
    <section class="relative w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 
    bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    <div class="p-6 md:p-10">
        <h2 class="text-lg mx-2 my-2 p-3 text-black font-bold">
            Log in
        </h2>
        <p class="text-sm mx-4 my-4 p-2 text-left text-black">
            Log in your account to upload or download pictures,videos or music.
        </p>
        <form class="mt-4 space-y-4" action="#" method="post">
            <label class="block" for="email">
                <span class="sr-only">Email address</span>
                <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email address"
                autocomplete="email"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 mx-4 my-4 text-black
                placeholder-slate-400 shadow-sm focus:outline-none"
                required/>
            </label>
            <div class="flex flex-col space-y-3 md:flex-row md:items-center md:space-y-0 md:space-x-3 mx-4 my-4 p-2">
                <a href="index.html" class="text-sm text-blue-600 underline underline-offset-2
                hover:text-blue-800">Forget Password?</a>
                <button class="mt-4 mx-4 my-4 inline-flex items-center justify-center px-6 py-3 text-xs rounded-md text-white bg-blue-500 
                hover:bg-blue-800 hover:text-white duration-500 shrink-0">
                Next</button>
            </button>
            </div>
        </form>
        <div class="my-8 flex items-center gap-4">
            <div class="h-px flex-1 bg-slate-200"></div>
            <span class="text-xs uppercase tracking-wider text-slate-400">Or log in with</span>
            <div class="h-px flex-1 bg-slate-200"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <button class="w-full inline-flex items-center justify-center border border-stale-400 shadow-sm
            px-6 py-3 text-xs rounded-md text-slate-400 bg-white hover:bg-slate-50">
            <img src="Login/pic3.jpeg" alt="" class="h-5 w-5">
            <p class="text-slate-400 text-xs mx-2 my-2">
                Facebook
            </p>
        </button>
        <button class="w-full inline-flex items-center justify-center border border-stale-400 shadow-sm
        px-6 py-3 text-xs rounded-md text-slate-400 bg-white hover:bg-slate-50">
        <img src="Login/pic1.jpeg" alt="" class="h-5 w-5">
        <p class="text-slate-400 text-xs mx-2 my-2">
            Google
        </p>
        </button>
        </div>
    </div>
        <div class="hidden md:block">            
            <img src="Login/pic2.jpeg" alt="Blue water" class="h-[90vh] w-full object-cover"/>
        </div>
    </section>
  </body>
